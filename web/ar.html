<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naqsha AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #f6f3ee; --ink: #1f2328; --muted: #6b6f76; --accent: #0f766e; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14171a; --ink: #e8e6e3; --muted: #9aa0a6; --accent: #2dd4bf; --accent-ink: #062b27; } }
  :root[data-theme="dark"] { --bg: #14171a; --ink: #e8e6e3; --muted: #9aa0a6; --accent: #2dd4bf; --accent-ink: #062b27; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; z-index: 2; pointer-events: none; }
  h1 { margin: 0; font-size: 18px; }
  #status { color: var(--muted); font-size: 13px; }
  #arBtn { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 999px; padding: 14px 22px; font: 600 16px system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #tips { position: fixed; left: 16px; right: 16px; bottom: 84px; z-index: 2; margin: 0; padding: 10px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); color: var(--muted); font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<header><h1>Naqsha · AR</h1><div id="status">Waiting for the house…</div></header>
<model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls auto-rotate shadow-intensity="1" exposure="1.05" alt="3D model of the house">
  <button slot="ar-button" id="arBtn">View on your table</button>
</model-viewer>
<p id="tips">For AR: good light, a textured surface (wood or a patterned cloth, not plain white or glass). Hold the phone 30–60 cm above it and move it slowly side to side until dots appear, then tap.</p>
<script>
  const mv = document.getElementById("mv"), status = document.getElementById("status");
  let version = 0;
  async function poll() {
    try {
      const r = await fetch("/api/model/version", { cache: "no-store" });
      const { version: v } = await r.json();
      if (v && v !== version) {
        version = v;
        mv.src = "/model.glb?v=" + v;
        status.textContent = "Scale 1:50 · updated " + new Date().toLocaleTimeString();
      }
    } catch { status.textContent = "Cannot reach the laptop. Same Wi-Fi?"; }
    setTimeout(poll, 2000);
  }
  poll();
</script>
</body>
</html>
